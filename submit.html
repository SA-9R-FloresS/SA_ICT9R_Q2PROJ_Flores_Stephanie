<!DOCTYPE html>
<html lang="en">
<head>
	<!-- META ATTRIBUTES -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<title>&#127876; Submit Recipe | Holiday Bites</title>

	<!-- BS5 SETUP -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

	<!-- CSS SETUP -->
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

	<!-- JS SETUP -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

	<style>
		.container {
			border: 2px solid rgba(255, 255, 255, 0.25);
			box-shadow: 0 0 20px 1px var(--hb-accent-1);
			backdrop-filter: blur(5px);
			border-radius: 50px;
		}

		h1 {
			font-family: 'Montserrat';
			color: var(--hb-primary);
			text-shadow: 0 5px 8px var(--hb-accent-2);
			font-weight: bold;
		}

		.form-label {
			font-family: 'Montserrat';
			font-weight: 600;
			font-size: 20px;
			display: flex;
			justify-content: center !important;
			color: var(--hb-secondary);
			text-shadow: 0 5px 8px var(--hb-accent-2);
			border-radius: 50px;
		}

		.form-control, textarea {
			border: 2px solid var(--hb-accent) !important;
		}

		.form-check-label:hover {
			color: var(--hb-primary);
			text-shadow: 0 5px 8px white,
			0 -5px 8px white;
		}
	</style>
</head>
<body>
	<!-- NAVIGATION BAR -->
	<nav class="navbar navbar-expand-lg">
		<div class="container-fluid">
			<!-- LOGO -->
			<a href="./index.html" class="navbar-brand">
				<img src="./assets/img/logo.png" alt="Holiday Bites"> 
			</a>
			<!-- TOGGLER -->
			<button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar"> 
				<span class="navbar-toggler-icon"></span>
			</button>
			<!-- CONTENT -->
			<div class="collapse navbar-collapse" id="collapsibleNavbar">
				<!-- LINKS -->
				<ul class="navbar-nav nav-pills">
					<li class="nav-item px-1">
						<a href="./index.html" class="nav-link">Home</a>
					</li>
					<li class="nav-item px-1 dropdown">
						<a href="./recipes.html" class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown">Recipes</a>
						<ul class="dropdown-menu">
							<li><a href="./recipes.html" class="dropdown-item">All</a></li>
							<li><a href="./recipes.html" class="dropdown-item">Drinks</a></li>
							<li><a href="./recipes.html" class="dropdown-item">Appetizer</a></li>
							<li><a href="./recipes.html" class="dropdown-item">Main Course</a></li>
							<li><a href="./recipes.html" class="dropdown-item">Dessert</a></li>
						</ul>
					</li>
					<li class="nav-item px-1">
						<a href="./about.html" class="nav-link">About</a>
					</li>
					<li class="nav-item px-1">
						<a href="./submit.html" class="nav-link active nav-link-submit">Submit Recipe</a>
					</li>
				</ul>
				<!-- SEARCH BAR -->
				<div class="navbar-nav ms-auto">
					<form class="d-flex">
						<input type="text" class="form-control" placeholder="Search">
						<button class="btn btn-dark" type="button">Search</button>
					</form>
				</div>
			</div>
		</div>
	</nav>
	<!-- END NAVIGATION BAR -->

	<!-- SUBMIT -->
	<div class="container my-5 animate__animated animate__fadeIn">
		<!-- HEADER -->
		<div class="header mt-5 text-center">
			<h1>SUBMIT YOUR RECIPE</h1>
		</div>

		<!-- CONTENT / FORM -->
		<div class="content">
			<form>
				<!-- PERSONAL INFORMATION -->
				<div class="row">
					<!-- NAME -->
					<div class="form-group col mb-3">
						<label for="name" class="form-label px-3">NAME</label>
						<input type="text" class="form-control" id="name" required>
					</div>

					<!-- AGE -->
					<div class="form-group col mb-3">
						<label for="age" class="form-label px-3">AGE</label>
						<input type="number" class="form-control" id="age" required>
					</div>	
				</div>

				<div class="row">
					<!-- EMAIL -->
					<div class="form-group col mb-3">
						<label for="email" class="form-label px-3">EMAIL ADDRESS</label>
						<input type="email" class="form-control" id="email" required>
					</div>
				
					<!-- PHONE -->
					<div class="form-group col mb-3">
						<label for="phone" class="form-label px-3">PHONE NUMBER</label>
						<input type="tel" class="form-control" id="phone" required>
					</div>
				</div>

				<!-- CATEGORY -->
				<div class="form-group mb-3">
					<label class="form-label px-3">WHAT CATEGORY?</label>
					<div class="form-check-inline">
						<input class="form-check-input" type="radio" name="cat" id="drink" value="drink">
						<label class="form-check-label" for="drink">Drink</label>
					</div>
					<div class="form-check-inline">
						<input class="form-check-input" type="radio" name="cat" id="appetizer" value="appetizer">
						<label class="form-check-label" for="appetizer">Appetizer</label>
					</div>
					<div class="form-check-inline">
						<input class="form-check-input" type="radio" name="cat" id="main" value="main">
						<label class="form-check-label" for="main">Main Course</label>
					</div>
					<div class="form-check-inline">
						<input class="form-check-input" type="radio" name="cat" id="dessert" value="dessert">
						<label class="form-check-label" for="dessert">Dessert</label>
					</div>
				</div>
				
				<!-- RECIPE INFORMATION -->
				<div class="mb-3">
					<label for="ingredients" class="form-label px-3">INGREDIENTS</label>
					<textarea class="form-control" id="ingredients" rows="4" placeholder="&#9733 Type the ingredients with their quantity." required></textarea>
				</div>
				<div class="mb-3">
					<label for="instructions" class="form-label px-3">INSTRUCTIONS</label>
					<textarea class="form-control" id="instructions" rows="4" placeholder="&#9733 Type the instructions here." required></textarea>
				</div>
				
				<button type="submit" action="./index.html" class="btn btn-success mb-3 rounded-5 px-4 d-flex mx-auto" style="font-family: 'Montserrat'; font-weight: 500;">SUBMIT</button>
			</form>
		</div>
	</div>
	<!-- END SUBMIT -->

	
</body>
</html>
